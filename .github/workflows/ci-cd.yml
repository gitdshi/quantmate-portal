name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".dockerignore"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/quantmate-portal

# ---------------------------------------------------------------------------
# Stage 1: CI — Lint & Type Check
# ---------------------------------------------------------------------------
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (non-blocking, temporarily paused)
        run: npm run lint || true

      - name: TypeScript type check (non-blocking, temporarily paused)
        run: npx tsc -p tsconfig.test.json --noEmit || true

# ---------------------------------------------------------------------------
# Stage 1: CI — Unit Tests (needs lint)
# ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --silent --exclude test/unit/pages/Settings.test.tsx --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

# ---------------------------------------------------------------------------
# Stage 2: Publish — Build & push Docker image to GHCR (only on main push)
# ---------------------------------------------------------------------------
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image build metadata
        id: build_meta
        run: echo "image_build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            IMAGE_BUILD_TIME=${{ steps.build_meta.outputs.image_build_time }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=portal-image
          cache-to: type=gha,mode=max,scope=portal-image

# ---------------------------------------------------------------------------
# Stage 3: Deploy Staging (only after publish succeeds)
# ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy Portal to Staging
    runs-on: ubuntu-latest
    needs: publish
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure staging SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.STAGING_SSH_KEY }}' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H '${{ secrets.STAGING_HOST }}' >> ~/.ssh/known_hosts

      - name: Prepare staging script bundle
        run: |
          mkdir -p .deploy_bundle/.github/scripts
          cp .github/scripts/deploy_portal_staging.sh .deploy_bundle/.github/scripts/deploy_portal_staging.sh

      - name: Pre-deploy staging disk cleanup
        run: |
          ssh -i ~/.ssh/staging_key '${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}' '
            set -e
            docker system prune -af || true
            docker builder prune -af || true
            df -h /
            docker system df || true
          '

      - name: Copy deploy script to staging server
        run: |
          ssh -i ~/.ssh/staging_key '${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}' '
            mkdir -p /opt/quantmate/.github/scripts
          '
          scp -i ~/.ssh/staging_key .deploy_bundle/.github/scripts/deploy_portal_staging.sh '${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/quantmate/.github/scripts/deploy_portal_staging.sh'

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/staging_key '${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}' "
            set -e
            cd /opt/quantmate
            GITHUB_OWNER='${{ github.repository_owner }}' PORTAL_IMAGE_TAG='sha-${{ github.sha }}' \
              sh .github/scripts/deploy_portal_staging.sh
          "
